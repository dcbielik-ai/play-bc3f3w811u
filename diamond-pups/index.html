<body>
<div id="turnPhone" role="alert"><div class="big">📱</div><div>Turn your phone sideways to play! 📱↻</div></div>

<div id="loading">Loading Diamond Pups...</div>
<canvas id="game" width="960" height="540"></canvas>
<script>
'use strict';
// ===== Diamond Pups: core (canvas, input, sound, save, helpers) =====
const W = 960, H = 540;
const FONT = "Fredoka, 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif";
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const VIEW = { scale: 1, css: 1 };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / W, wh / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  cvs.style.left = Math.floor((ww - cw) / 2) + 'px'; cvs.style.top = Math.floor((wh - ch) / 2) + 'px';
  cvs.width = Math.floor(cw * dpr); cvs.height = Math.floor(ch * dpr);
  VIEW.scale = cvs.width / W; VIEW.css = cw / W;
}
window.addEventListener('resize', resize);
resize();

// ---------- math helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const rnd = (a, b) => a + Math.random() * (b - a);
function hash(i, seed) { const x = Math.sin(i * 127.1 + (seed || 0) * 311.7) * 43758.5453; return x - Math.floor(x); }
function vnoise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, seed), hash(i + 1, seed), u); }
const inRect = (px, py, r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

// ---------- input ----------
const keys = {}, pressed = {};
const PREVENT = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'];
window.addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (PREVENT.includes(e.code)) e.preventDefault();
  Snd.unlock();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const anyPressed = (...codes) => codes.some(c => pressed[c]);
const anyKey = (...codes) => codes.some(c => keys[c]);

const pointers = new Map();     // id -> {x,y}
let taps = [];                  // {x,y,used}
function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  Snd.unlock();
  const p = toLogical(e);
  pointers.set(e.pointerId, p);
  taps.push({ x: p.x, y: p.y, used: false });
  try { cvs.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
cvs.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, toLogical(e)); });
const endPtr = e => { pointers.delete(e.pointerId); };
cvs.addEventListener('pointerup', endPtr);
cvs.addEventListener('pointercancel', endPtr);
cvs.addEventListener('contextmenu', e => e.preventDefault());

// take a tap inside rect (marks used)
function tapIn(r) {
  for (const t of taps) if (!t.used && inRect(t.x, t.y, r)) { t.used = true; return t; }
  return null;
}
function heldIn(r) { for (const p of pointers.values()) if (inRect(p.x, p.y, r)) return true; return false; }
function freeTap() { for (const t of taps) if (!t.used) { t.used = true; return t; } return null; }
function endFrameInput() { taps = []; for (const k in pressed) delete pressed[k]; }

// ---------- save ----------
const SAVE_KEY = 'diamondPups.save.v1';
function defaultSave() {
  return { started: false, girl: { hair: 0, skin: 1, outfit: 0 }, diamonds: {}, gems: {}, seen: {}, muted: false };
}
function loadSave() {
  let d = null;
  try { d = JSON.parse(window.localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { d = null; }
  const s = defaultSave();
  if (d && typeof d === 'object') {
    Object.assign(s, d);
    s.girl = Object.assign(defaultSave().girl, d.girl || {});
    s.diamonds = d.diamonds || {}; s.gems = d.gems || {}; s.seen = d.seen || {};
  }
  return s;
}
let save = loadSave();
function writeSave() { try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage may be blocked */ } }

// ---------- sound (all made in code with WebAudio) ----------
const Snd = {
  ac: null, master: null, musicGain: null, muted: false,
  unlock() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = this.muted ? 0 : 0.55;
        this.master.connect(this.ac.destination);
        this.musicGain = this.ac.createGain();
        this.musicGain.gain.value = 0.16;
        this.musicGain.connect(this.master);
      } catch (e) { this.ac = null; return; }
    }
    if (this.ac.state === 'suspended') this.ac.resume().catch(() => {});
  },
  setMuted(m) {
    this.muted = m; save.muted = m; writeSave();
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ac.currentTime, 0.03);
  },
  tone(freq, dur, type, vol, slide, delay, dest) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, delay, q) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(this.ac.sampleRate * dur));
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    const g = this.ac.createGain(); g.gain.value = vol || 0.2;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  play(name) {
    if (!this.ac || this.muted) return;
    switch (name) {
      case 'click': this.tone(660, 0.08, 'triangle', 0.2); break;
      case 'jump': this.tone(330, 0.18, 'square', 0.07, 660); break;
      case 'gem': this.tone(988, 0.12, 'triangle', 0.22); this.tone(1319, 0.2, 'triangle', 0.2, null, 0.07); break;
      case 'bigGem': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.2, null, i * 0.06)); break;
      case 'switch': this.tone(523, 0.08, 'sine', 0.2); this.tone(784, 0.1, 'sine', 0.2, null, 0.06); break;
      case 'bark': this.tone(520, 0.09, 'sawtooth', 0.09, 300); this.tone(560, 0.1, 'sawtooth', 0.08, 320, 0.15); break;
      case 'sniff': for (let i = 0; i < 4; i++) this.noise(0.09, 0.25, 2500, i * 0.16, 2); break;
      case 'dig': for (let i = 0; i < 5; i++) this.noise(0.12, 0.35, 400, i * 0.2, 0.8); break;
      case 'push': this.noise(0.9, 0.35, 160, 0, 0.7); this.tone(90, 0.8, 'triangle', 0.15, 60); break;
      case 'pop': this.tone(400, 0.1, 'sine', 0.25, 900); break;
      case 'lever': this.tone(220, 0.06, 'square', 0.1); this.tone(330, 0.06, 'square', 0.1, null, 0.08); break;
      case 'rumble': this.noise(1.1, 0.3, 120, 0, 0.6); break;
      case 'boing': this.tone(200, 0.35, 'sine', 0.25, 600); break;
      case 'spot': [1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, 0.25, 'sine', 0.13, null, i * 0.08)); break;
      case 'wrong': this.tone(300, 0.18, 'triangle', 0.18, 220); break;
      case 'right': [523, 659, 784].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.2, null, i * 0.09)); break;
      case 'unroll': for (let i = 0; i < 6; i++) this.tone(300 + i * 60, 0.06, 'triangle', 0.12, null, i * 0.07); break;
      case 'key': [659, 880, 1109, 1319].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.2, null, i * 0.09)); break;
      case 'door': this.noise(1.2, 0.25, 200, 0, 0.6); [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.3, 'sine', 0.15, null, 0.6 + i * 0.12)); break;
      case 'fanfare': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, i === 6 ? 0.6 : 0.2, 'triangle', 0.22, null, i * 0.13)); break;
      case 'fall': this.tone(700, 0.4, 'sine', 0.18, 200); this.tone(300, 0.3, 'sine', 0.2, 700, 0.45); break;
    }
  }
};
Snd.muted = !!save.muted;

// gentle background music: pentatonic tunes, scheduled ahead in WebAudio time
const Music = {
  tune: null, step: 0, next: 0,
  tunes: {
    title: { bpm: 104, notes: [72, 76, 79, 76, 81, 79, 76, 74, 72, 74, 76, 79, 76, 74, 72, 0], bass: [48, 0, 55, 0, 53, 0, 55, 0] },
    map: { bpm: 96, notes: [67, 69, 72, 74, 76, 74, 72, 69, 67, 72, 69, 67, 64, 67, 69, 0], bass: [48, 0, 52, 0, 53, 0, 55, 0] },
    level: { bpm: 112, notes: [72, 0, 74, 76, 79, 0, 76, 74, 72, 0, 69, 72, 74, 0, 72, 0], bass: [48, 55, 52, 55, 53, 57, 55, 52] },
    ice: { bpm: 92, notes: [76, 0, 79, 81, 84, 0, 81, 79, 76, 0, 74, 76, 79, 0, 0, 0], bass: [45, 0, 52, 0, 48, 0, 52, 0] },
  },
  play(name) { if (this.tune !== this.tunes[name]) { this.tune = this.tunes[name] || null; this.step = 0; this.next = 0; } },
  update() {
    const ac = Snd.ac; if (!ac || !this.tune || Snd.muted) return;
    const spb = 60 / this.tune.bpm / 2;
    if (this.next < ac.currentTime) this.next = ac.currentTime + 0.05;
    while (this.next < ac.currentTime + 0.2) {
      const n = this.tune.notes[this.step % this.tune.notes.length];
      const b = this.tune.bass[Math.floor(this.step / 2) % this.tune.bass.length];
      const dt = this.next - ac.currentTime;
      if (n) Snd.tone(440 * Math.pow(2, (n - 69) / 12), spb * 1.6, 'triangle', 0.5, null, dt, this.musicGain());
      if (b && this.step % 2 === 0) Snd.tone(440 * Math.pow(2, (b - 69) / 12), spb * 1.8, 'sine', 0.6, null, dt, this.musicGain());
      this.next += spb; this.step++;
    }
  },
  musicGain() { return Snd.musicGain; }
};

  IMG[name] = im;
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function setFont(size, weight) { ctx.font = (weight || 600) + ' ' + size + 'px ' + FONT; }
function txt(s, x, y, size, color, align, o) {
  o = o || {};
  setFont(size || 28, o.weight);
  ctx.textAlign = align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.stroke !== false) {
    ctx.lineJoin = 'round'; ctx.lineWidth = o.lw || Math.max(3, (size || 28) / 5);
    ctx.strokeStyle = o.stroke || 'rgba(60,30,20,0.9)';
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function emo(ch, x, y, size) {
  ctx.font = size + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(ch, x, y);
}
function wrapLines(s, maxW, size) {
  setFont(size);
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// immediate-mode button; returns true when tapped (or hot key pressed)
function button(r, label, o) {
  o = o || {};
  const hover = heldIn(r);
  const t = tapIn(r);
  const hit = !!t || (o.key && anyPressed(...[].concat(o.key)));
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  const pr = hover ? 3 : 0;
  rr(r.x, r.y + 5, r.w, r.h, o.radius || 18); ctx.fillStyle = 'rgba(40,20,40,0.35)'; ctx.fill();
  rr(r.x, r.y + pr, r.w, r.h, o.radius || 18);
  const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
  const c = o.color || '#ff8fb8';
  g.addColorStop(0, o.color2 || lighten(c, 0.25)); g.addColorStop(1, c);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = o.border || '#5a2a3a'; ctx.stroke();
  if (o.icon) {
    if (o.label2 === undefined && !label) emo(o.icon, r.x + r.w / 2, r.y + r.h / 2 + pr + 2, o.iconSize || r.h * 0.55);
    else emo(o.icon, r.x + (o.iconX || 34), r.y + r.h / 2 + pr + 2, o.iconSize || r.h * 0.5);
  }
  if (label) txt(label, r.x + r.w / 2 + (o.icon ? 16 : 0), r.y + r.h / 2 + pr + 1, o.size || 28, o.textColor || '#fff', 'center');
  ctx.restore();
  if (hit) Snd.play('click');
  return hit;
}
function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * amt); g = Math.round(g + (255 - g) * amt); b = Math.round(b + (255 - b) * amt);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function darken(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * (1 - amt)); g = Math.round(g * (1 - amt)); b = Math.round(b * (1 - amt));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function panel(x, y, w, h, fill, border) {
  rr(x, y + 6, w, h, 24); ctx.fillStyle = 'rgba(30,10,40,0.35)'; ctx.fill();
  rr(x, y, w, h, 24); ctx.fillStyle = fill || '#fff8ec'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = border || '#6b3b2a'; ctx.stroke();

// ---------- particles ----------
let particles = [];
function burst(x, y, n, colors, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(o.min || 1.5, o.max || 5);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 1.5), life: rnd(0.5, 1.1) * (o.life || 1), max: 1,
      color: colors[i % colors.length], size: rnd(3, 7) * (o.scale || 1), type: o.type || 'spark', g: o.g == null ? 0.15 : o.g, rot: rnd(0, 6), screen: !!o.screen });
  }
}
function updateParticles(dt) {
  const k = dt * 60;
  for (const p of particles) { p.x += p.vx * k; p.y += p.vy * k; p.vy += p.g * k; p.life -= dt; p.rot += 0.1 * k; }
  particles = particles.filter(p => p.life > 0);

function drawParticles(ox, screenPass) {
  for (const p of particles) {

    ctx.save(); ctx.globalAlpha = clamp(p.life * 1.5, 0, 1);
    ctx.translate(p.x - (ox || 0), p.y); ctx.rotate(p.rot);

    else if (p.type === 'confetti') ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);

}
function star4(x, y, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
}

    if (spec.type === 'dials') P.dials = spec.target.slice();
    if (spec.type === 'match') P.cards.forEach(c => { c.up = true; c.matched = true; });
    win();
  };

    if (spec.type === 'riddle' || spec.type === 'pattern') {
      const wrongs = spec.choices.map((c, i) => i).filter(i => i !== spec.answer && !P.removed[i]);
      if (wrongs.length > 1) P.removed[wrongs[0]] = true;
      say('Poppi: "' + spec.hint + '"', true);
    } else if (spec.type === 'dials') {
      const i = P.dials.findIndex((d, k) => d !== spec.target[k]);

    } else if (spec.type === 'dials') {
      P.dials[i] = (P.dials[i] + 1) % spec.symbols.length; Snd.play('click'); P.shake[i] = 0.25; check();

      for (let k = 0; k < 6; k++) out.push({ x: W / 2 - 205 + (k % 3) * 140, y: 172 + Math.floor(k / 3) * 140, w: 120, h: 126 });
    } else if (spec.type === 'dials') {

      if (spec.type === 'pattern') {

        ctx.restore();

    } else if (spec.type === 'dials') {
      // target picture painted on the door
      rr(W / 2 - 170, 160, 340, 72, 14); ctx.fillStyle = '#b8a48a'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#6b5a40'; ctx.stroke();
      spec.target.forEach((s, k) => emo(spec.symbols[s], W / 2 - 100 + k * 100, 198, 48));
      rs.forEach((r, i) => {
        const cx = r.x + r.w / 2, cy = r.y + r.h / 2, ok = P.dials[i] === spec.target[i];

        txt('tap!', cx, r.y + r.h + 26, 20, '#8e7fa8', 'center', { stroke: false });

    } else if (spec.type === 'match') {
      P.cards.forEach((c, i) => {
        const r = rs[i]; const face = c.up || c.matched || P.peek > 0 || P.done;

      block(B.x, 760, B.top);
      B.gate = { x: B.x + 280, w: 84, h: 230, base: B.top, open: 0, state: 'locked', keyIn: false };
      B.pedestal = { x: B.x + 540, base: B.top, taken: false };
      B.x += 760; block(B.x, 500, B.top);
    },
  };
  def.layout.forEach(sec => S[sec]());
  B.len = B.x + 100;
  B.sniffs.forEach(s => { if (!s.target) s.target = s.def; });
  // merge-looking seams: mark block edges that touch a neighbour with the same height
  B.blocks.forEach(b => { b.joinR = B.blocks.some(o => o !== b && Math.abs(o.x - (b.x + b.w)) < 1 && o.top <= b.top);
    b.joinL = B.blocks.some(o => o !== b && Math.abs(o.x + o.w - b.x) < 1 && o.top <= b.top); });
  return B;
}

// ---------- scripting helpers (generators run one step per frame) ----------
function* wait(s) { let t = 0; while (t < s) t += yield; }
function takePup(i) { const p = L.pups[i]; p.ov = true; p.ox = p.x; p.oy = p.y; p.oface = p.face; p.osit = false; p.orot = 0; return p; }
function* pupTo(p, x, y, speed, arc) {
  const sx = p.ox, sy = p.oy, d = Math.hypot(x - sx, y - sy), dur = Math.max(0.12, d / ((speed || 6) * 60));
  if (x !== sx) p.oface = x > sx ? 1 : -1;
  p.osit = false; let t = 0;
  while (t < dur) { t += yield; const k = Math.min(1, t / dur); p.ox = sx + (x - sx) * k; p.oy = sy + (y - sy) * k - Math.sin(k * Math.PI) * (arc || 0); p.phase += 0.35; }
}
function* releasePup(i) { const p = L.pups[i]; const tg = chainTarget(chainSlot(i)); yield* pupTo(p, tg.x, tg.y, 7, 0); p.ov = false; p.x = p.ox; p.y = p.oy; }
function run(gen) { gen.next(); L.scripts.push(gen); }
function say(text, who, dur) { L.msg = { text, who: who == null ? null : who, t: dur || 3.6 }; }
function markSeen(k) { if (!save.seen[k]) { save.seen[k] = true; writeSave(); } }

// ---------- talents ----------
function* scPush(b) {
  const p = takePup(1); b.state = 'busy';
  yield* pupTo(p, b.x - b.r - 26, b.top, 6);
  Snd.play('bark'); say('Boots: "Heave-ho! I\'m super strong!"', 1);
  for (let i = 0; i < 3; i++) { yield* pupTo(p, p.ox + 7, b.top, 2); yield* pupTo(p, p.ox - 7, b.top, 2); }
  Snd.play('push');
  const sx = b.x, tx = b.pitX + b.pitW / 2;
  while (b.x < tx) { const dt = yield; b.x = Math.min(tx, b.x + 3.4 * dt * 60); b.rot = (b.x - sx) / b.r; p.ox = Math.min(b.x - b.r - 26, b.pitX - 30); p.oface = 1; p.phase += 0.3; }
  const sy = b.y, ty = b.top + b.r * 0.82; let t = 0;
  while (t < 0.3) { t += yield; b.y = sy + (ty - sy) * Math.min(1, t / 0.3); }
  Snd.play('rumble'); L.shake = 10;
  burst(b.x, b.top, 24, ['#c9a77a', '#a98a60', '#fff'], { type: 'dirt', up: 3 });
  L.blocks.push({ x: b.pitX, w: b.pitW, top: b.top, fill: true });
  b.state = 'done'; markSeen('boulder');
  say('Boom! The boulder filled the hole. Now it is a bridge! 🎉', 1);
  yield* wait(0.4); yield* releasePup(1);
}
function* scSqueeze(w) {
  const p = takePup(2); w.state = 'busy';
  yield* pupTo(p, w.x - 34, w.base, 6);
  say('Poppi: "I\'m tiny! I can squeeze through!"', 2); Snd.play('pop');
  yield* pupTo(p, w.x + w.w + 34, w.base, 2.4);
  Snd.play('bark');
  yield* pupTo(p, w.leverX - 26, w.base, 5);
  yield* wait(0.2); w.leverOn = true; Snd.play('lever');
  yield* wait(0.3); Snd.play('rumble'); L.shake = 6;
  let t = 0; while (t < 1.2) { const dt = yield; t += dt; w.drop = Math.min(w.h, w.h * t / 1.2); if (Math.random() < 0.4) burst(w.x + rnd(0, w.w), w.base, 1, ['#d9c7a8'], { type: 'dirt' }); }
  w.state = 'done'; markSeen('gap');
  say('Poppi pulled the lever and the wall went down! Clever Poppi!', 2);
  yield* wait(0.3); yield* releasePup(2);
}
function* scLedge(l) {
  const p = takePup(3); l.state = 'busy';
  yield* pupTo(p, l.x - 60, l.base, 6);
  say('Patch: "Up, up and away!"', 3); Snd.play('boing');
  yield* pupTo(p, l.x + 50, l.top, 4, 150);
  Snd.play('bark'); yield* wait(0.25); Snd.play('unroll');
  let t = 0; while (t < 0.9) { t += yield; l.ladder = Math.min(1, t / 0.9); }
  l.state = 'done'; markSeen('ledge');
  say('Patch dropped a rope ladder! Hold ↑ or JUMP to climb it!', 3);
  yield* wait(0.5);
  yield* pupTo(p, l.x - 70, l.base, 4, 60);
  yield* releasePup(3);
}
function* scSpot() {
  const p = takePup(3); p.osit = true;
  Snd.play('spot'); L.ring = { x: p.ox, y: p.oy - 40, t: 0 };
  let n = 0;
  for (const h of L.hidden) if (!h.revealed && Math.abs(h.x - p.ox) < 720) { h.revealed = true; n++; burst(h.x, h.y, 14, ['#fff6a0', '#ffffff', '#ffd23a']); }
  yield* wait(0.8);
  if (n) { markSeen('hidden'); say('Patch: "My keen eye spots ' + n + ' hidden sparkle' + (n > 1 ? 's' : '') + '! Tap them or press ↓ to grab them!"', 3, 4.5); }
  else say('Patch: "My keen eye sees... nothing hidden here. Let\'s explore!"', 3);
  p.osit = false; yield* releasePup(3);
}
function* scSniff(s) {
  const p = takePup(0); s.state = 'busy';
  yield* pupTo(p, s.x, s.y, 6);
  Snd.play('sniff'); say('Remi: "Sniff, sniff... I smell something!"', 0);
  for (let i = 0; i < 3; i++) { p.orot = 0.2; yield* pupTo(p, p.ox + 14, s.y, 1.4); yield* pupTo(p, p.ox - 14, s.y, 1.4); }
  p.orot = 0;
  const tg = s.target, dur = Math.max(0.6, Math.abs(tg.x - s.x) / 420);
  let t = 0; while (t < dur) { t += yield; s.trail = Math.min(1, t / dur); }
  L.digs.push({ x: tg.x, y: tg.y, state: 'x' });
  burst(tg.x, tg.y - 20, 14, ['#ffd23a', '#fff']);
  Snd.play('bark'); s.state = 'done'; markSeen('sniff');
  say('Remi found a buried spot! Follow the paw prints to the X! 🐾', 0, 4.5);
  yield* wait(0.5); yield* releasePup(0);
}
function* scDig(d) {
  const p = takePup(1); d.state = 'busy';
  yield* pupTo(p, d.x - 30, d.y, 6);
  say('Boots: "Dig, dig, dig!"', 1); Snd.play('dig');
  let t = 0; while (t < 1.2) { const dt = yield; t += dt; p.orot = Math.sin(t * 30) * 0.08; if (Math.random() < 0.5) burst(d.x, d.y - 5, 2, ['#8a5a32', '#b07a43', '#5a3418'], { type: 'dirt', up: 4 }); }
  p.orot = 0; d.state = 'dug';
  Snd.play('key'); L.keyFly = { x: d.x, y: d.y - 20, t: 0 }; L.hasKey = true; markSeen('dig');
  burst(d.x, d.y - 30, 30, ['#ffd23a', '#fff6a0', '#fff']);
  say('You found the PAW KEY! 🔑 It opens the Diamond Door!', null, 4);
  yield* wait(0.6); yield* releasePup(1);
}
function* scOpenGate() {
  const g = L.gate; g.keyIn = true; g.state = 'opening';
  Snd.play('door'); L.shake = 6;
  let t = 0; while (t < 1.6) { t += yield; g.open = Math.min(1, t / 1.6); }
  g.state = 'open'; markSeen('gate');
  say('The Diamond Door is open! Go get the diamond! 💎', null);
}

function nearAhead(ox, oy, maxAhead, maxBehind) { const p = L.player; const d = ox - p.x; return d < maxAhead && d > -maxBehind && Math.abs(oy - p.y) < 70; }
function findTargets() {
  return {
    b: L.boulders.find(b => b.state === 'idle' && nearAhead(b.x - b.r, b.top, 260, 40)),
    w: L.walls.find(w => w.state === 'idle' && nearAhead(w.x, w.base, 260, 60)),
    l: L.ledges.find(l => l.state === 'idle' && nearAhead(l.x, l.base, 260, 40)),
    s: L.sniffs.find(s => s.state === 'idle' && Math.abs(s.x - L.player.x) < 230 && Math.abs(s.y - L.player.y) < 80),
    d: L.digs.find(d => d.state === 'x' && Math.abs(d.x - L.player.x) < 210 && Math.abs(d.y - L.player.y) < 80),
    g: L.gate && L.gate.state === 'locked' && nearAhead(L.gate.x, L.gate.base, 260, 40) ? L.gate : null,
  };
}
function oops(kind, i) {
  L.wrong[kind] = (L.wrong[kind] || 0) + 1;
  Snd.play('wrong');
  const line = (OOPS[kind] && OOPS[kind][i]) || 'Hmm, I can\'t help with that one!';
  say(PUPS[i].name + ': "' + line + '"', i, 3.4);
}
function poppiHint() {
  const px = L.player.x;
  const d = L.digs.find(d => d.state === 'x');
  if (d) return 'There is an X to dig! Boots is our digger. Press 2!';
  const s = L.sniffs.find(s => s.state === 'idle');
  if (L.gate && !L.hasKey && Math.abs(L.gate.x - px) < 400) return 'The door needs a key. Maybe it is buried! Remi can sniff it out.';
  const hz = L.hiddenZones.find(z => px > z.x - 100 && px < z.x2 + 100 && L.hidden.some(h => !h.revealed && h.x > z.x && h.x < z.x2));
  if (hz) return 'I think sparkles are hiding here! Patch\'s keen eye can spot them.';
  if (s && Math.abs(s.x - px) < 500) return 'I smell a clue nearby! Remi has the best nose.';
  return 'Let\'s keep exploring! Run that way →';
}
function useTalent() {
  if (L.scripts.length || L.overlay) return;
  const i = L.active, T = findTargets();
  const obst = T.b ? 'boulder' : T.w ? 'gap' : T.l ? 'ledge' : null;
  if (i === 0) {           // Remi: super sniffer
    if (T.s) return run(scSniff(T.s));
    if (T.d) { Snd.play('bark'); return say('Remi: "I already found it! Boots is the digger!"', 0); }
    if (obst) return oops(obst, 0);
    if (T.g && !L.hasKey) { const s = L.sniffs.find(s => s.state === 'idle'); if (s) { Snd.play('sniff'); return say('Remi: "The key smells like it is back that way ←. Let\'s find the smelly spot!"', 0); } }
    const s = L.sniffs.find(s => s.state === 'idle');
    Snd.play('sniff');
    if (s) say('Remi: "Sniff sniff... something smells interesting that way ' + (s.x > L.player.x ? '→' : '←') + '"', 0);
    else say('Remi: "Sniff sniff... nothing new to smell here!"', 0);
  } else if (i === 1) {    // Boots: strong digger & pusher
    if (T.b) return run(scPush(T.b));
    if (T.d) return run(scDig(T.d));
    if (T.s) { Snd.play('wrong'); return say('Boots: "I can dig, but WHERE? A puppy with a super nose could find the spot!"', 1); }
    if (obst) return oops(obst, 1);
    if (T.g) return oops('gate', 1);
    Snd.play('bark'); say('Boots: "Woof! Nothing to push or dig here!"', 1);
  } else if (i === 2) {    // Poppi: tiny squeezer & clever helper
    if (T.w) return run(scSqueeze(T.w));
    if (obst) return oops(obst, 2);
    Snd.play('bark'); say('Poppi: "' + poppiHint() + '"', 2, 4.2);
  } else {                 // Patch: high jumper & keen-eyed spotter
    if (T.l) return run(scLedge(T.l));
    if (obst) { L.wrong[obst] = (L.wrong[obst] || 0) + 1; }
    run(scSpot());
  }
}

// ---------- level setup ----------
function startLevel(idx) {
  const def = LEVELS[idx];
  const B = buildLevel(def, idx);
  L = Object.assign(B, {
    def, idx, T: THEMES[def.theme], camX: 0, t: 0, scripts: [], msg: null, hint: null, wrong: {}, nearT: {},
    player: { x: 300, y: GY, vx: 0, vy: 0, w: 34, h: 96, face: 1, onGround: true, phase: 0, climb: false, coyote: 0 },
    pups: PUPS.map((P, i) => ({ x: 300 - (i + 1) * 60, y: GY, face: 1, moving: false, idle: 1, ov: false, phase: i, ox: 0, oy: 0 })),
    hist: [], active: 0, hasKey: false, gemCount: 0, overlay: null, puzzle: null, gateCool: false, keyFly: null, ring: null,
    shake: 0, introT: 3.2, safe: { x: 300, y: GY }, moved: 0, floats: [], winT: 0,
  });
  for (let k = 0; k < 80; k++) L.hist.push({ x: 300 - (80 - k) * 4, y: GY });
  particles = [];
  Music.play(L.T.music);
}
function chainSlot(i) { const order = [L.active].concat([0, 1, 2, 3].filter(k => k !== L.active)); return order.indexOf(i); }
function chainTarget(slot) {
  const idx = L.hist.length - 1 - (slot + 1) * 15;
  const h = L.hist[Math.max(0, idx)];
  return { x: h.x, y: h.y };
}
function solids() {
  const out = [];
  for (const b of L.blocks) out.push({ x: b.x, w: b.w, top: b.top, bot: H + 600 });
  for (const b of L.boulders) if (b.state !== 'done') out.push({ x: b.x - b.r * 0.9, w: b.r * 1.8, top: b.y - b.r, bot: b.y + b.r });
  for (const w of L.walls) if (w.drop < w.h - 4) out.push({ x: w.x, w: w.w, top: w.base - w.h + w.drop, bot: w.base });
  if (L.gate && L.gate.open < 0.98) out.push({ x: L.gate.x, w: L.gate.w, top: L.gate.base - L.gate.h - 22 - L.gate.open * 300, bot: L.gate.base - L.gate.open * 300 });
  return out;
}
function supported(x, y) { return L.blocks.some(b => x >= b.x && x <= b.x + b.w && Math.abs(b.top - y) < 2); }

function respawn() {
  const p = L.player;
  if (!supported(L.safe.x, L.safe.y)) {
    const left = L.blocks.filter(b => b.x + b.w <= p.x + 1 && !b.fill).sort((a, c) => (c.x + c.w) - (a.x + a.w))[0] || L.blocks[0];
    L.safe = { x: left.x + left.w - 50, y: left.top };
  }
  p.x = L.safe.x; p.y = L.safe.y; p.vx = 0; p.vy = 0; p.climb = false;
  L.hist = []; for (let k = 0; k < 80; k++) L.hist.push({ x: p.x - (80 - k) * 2 * p.face, y: p.y });
  L.pups.forEach(q => { q.x = p.x - 30; q.y = p.y; q.ov = false; });
  Snd.play('fall'); burst(p.x, p.y - 50, 20, ['#fff6a0', '#ff9ad5', '#9be8ff']);
  say('Boing! Back you go! You can\'t get hurt here. 🐾', null, 2.6);
}

function addGems(n, x, y) {
  L.gemCount += n;
  L.floats.push({ x, y, text: '+' + n, t: 1.2 });
  Snd.play(n > 1 ? 'bigGem' : 'gem');
  burst(x, y, 8 + n * 3, GEM_COLORS);
}
function doSearch(sp) {
  sp.searched = true; sp.wig = 0.6; Snd.play('pop'); markSeen('search');
  addGems(sp.gems, sp.x, sp.y - 70);
  if (sp.funny) say(sp.funny + '  And a sparkly gem!', null, 3);
  else say('You found ' + sp.gems + ' sparkly gems! ✨', null, 2.4);
}
function grabHidden(h) { h.found = true; addGems(3, h.x, h.y); say('A hidden sparkle! +3 gems! ✨', 3, 2.4); }

// ---------- controls (screen rects) ----------
const CTRL = {
  left: { x: 14, y: 438, w: 86, h: 86 }, right: { x: 110, y: 438, w: 86, h: 86 },
  search: { x: W - 312, y: 452, w: 76, h: 72 }, talent: { x: W - 222, y: 436, w: 96, h: 90 }, jump: { x: W - 114, y: 436, w: 96, h: 90 },
  map: { x: W - 72, y: 12, w: 58, h: 52 }, mute: { x: W - 140, y: 12, w: 58, h: 52 },
};
const pupRect = i => ({ x: 14 + i * 80, y: 8, w: 72, h: 90 });

function levelUpdate(dt) {
  const k = dt * 60;
  L.t += dt;
  updateParticles(dt);
  if (L.shake > 0) L.shake = Math.max(0, L.shake - dt * 30);
  L.floats.forEach(f => { f.t -= dt; f.y -= 40 * dt; }); L.floats = L.floats.filter(f => f.t > 0);
  if (L.introT > 0) L.introT -= dt;
  if (L.msg) { L.msg.t -= dt; if (L.msg.t <= 0) L.msg = null; }
  if (L.keyFly) { L.keyFly.t += dt; if (L.keyFly.t > 1.5) L.keyFly = null; }
  if (L.ring) { L.ring.t += dt; if (L.ring.t > 1.2) L.ring = null; }
  if (L.overlay === 'puzzle') { L.puzzle.update(dt); return; }
  if (L.overlay) { L.winT += dt; return; }

  // HUD taps
  for (let i = 0; i < 4; i++) if (tapIn(pupRect(i))) selectPup(i);
  for (let i = 0; i < 4; i++) if (pressed['Digit' + (i + 1)] || pressed['Numpad' + (i + 1)]) selectPup(i);
  if (pressed.KeyQ || pressed.Tab) selectPup((L.active + 1) % 4);
  if (tapIn(CTRL.map) || pressed.Escape || pressed.KeyP) { L.overlay = 'pause'; L.winT = 0; Snd.play('click'); return; }
  if (tapIn(CTRL.mute)) Snd.setMuted(!Snd.muted);

  const p = L.player;
  const busy = L.scripts.length > 0;
  const lHeld = anyKey('ArrowLeft', 'KeyA') || heldIn(CTRL.left);
  const rHeld = anyKey('ArrowRight', 'KeyD') || heldIn(CTRL.right);
  const upHeld = anyKey('ArrowUp', 'KeyW');
  const jHeld = anyKey('Space') || upHeld || heldIn(CTRL.jump);
  const jPress = anyPressed('Space', 'ArrowUp', 'KeyW') || !!tapIn(CTRL.jump);
  const dHeld = anyKey('ArrowDown', 'KeyS');
  const talentPress = anyPressed('KeyE', 'Enter', 'KeyX', 'ShiftLeft', 'ShiftRight') || !!tapIn(CTRL.talent);
  const searchPress = anyPressed('ArrowDown', 'KeyS') || !!tapIn(CTRL.search);

  let dir = busy ? 0 : (rHeld ? 1 : 0) - (lHeld ? 1 : 0);
  if (dir) p.face = dir;

  // ladders
  let onLadder = null;
  for (const l of L.ledges) if (l.state === 'done' && Math.abs(p.x - (l.x - 17)) < 26 && p.y > l.top + 0.5 && p.y <= l.base + 1) onLadder = l;
  if (!busy && onLadder && (jHeld || (p.climb && !p.onGround))) p.climb = true;
  if (!onLadder) p.climb = false;
  if (p.climb) {
    p.vx = dir * 1.5; p.vy = jHeld ? -3.6 : dHeld ? 3.6 : 0;
    p.x += p.vx * k; p.y += p.vy * k; p.phase += (p.vy ? 0.25 : 0) * k;
    if (p.y <= onLadder.top + 1) { p.y = onLadder.top; p.x = onLadder.x + 22; p.climb = false; p.vy = 0; p.onGround = true; }
    if (p.y >= onLadder.base) { p.y = onLadder.base; p.climb = false; }
  } else {
    p.vx = approach(p.vx, dir * RUN, (p.onGround ? 0.7 : 0.45) * k);
    if (p.onGround) p.coyote = 0.1; else p.coyote -= dt;
    if (!busy && jPress && p.coyote > 0) { p.vy = JUMP_V; p.coyote = 0; p.onGround = false; Snd.play('jump'); }
    if (!jHeld && p.vy < -5) p.vy = -5;
    p.vy = Math.min(14, p.vy + GRAV * k);
    const S = solids();
    // X
    p.x += p.vx * k;
    p.x = clamp(p.x, 20, L.len - 120);
    for (const s of S) {
      if (p.x - p.w / 2 < s.x + s.w && p.x + p.w / 2 > s.x && p.y - p.h < s.bot && p.y > s.top + 0.5) {
        if (p.x < s.x + s.w / 2) p.x = s.x - p.w / 2 - 0.01; else p.x = s.x + s.w + p.w / 2 + 0.01;
        p.vx = 0;
      }
    }
    // Y
    const prevY = p.y;
    p.y += p.vy * k; p.onGround = false;
    for (const s of S) {
      if (p.x - p.w / 2 < s.x + s.w && p.x + p.w / 2 > s.x && p.y - p.h < s.bot && p.y > s.top) {
        if (p.vy >= 0 && prevY <= s.top + 10) { p.y = s.top; p.vy = 0; p.onGround = true; }
        else if (p.vy < 0) { p.y = s.bot + p.h; p.vy = 0; }
      }
    }
    if (p.vy >= 0) for (const pl of L.plats) {
      if (p.x + 10 > pl.x && p.x - 10 < pl.x + pl.w && prevY <= pl.y + 1 && p.y >= pl.y) { p.y = pl.y; p.vy = 0; p.onGround = true; }
    }
    if (p.onGround && Math.abs(p.vx) > 0.2) p.phase += 0.24 * k;
    if (p.onGround && supported(p.x - 22, p.y) && supported(p.x + 22, p.y)) L.safe = { x: p.x, y: p.y };
  }
  if (p.y > H + 140) respawn();

  // puppy chain follows the girl's footsteps
  const last = L.hist[L.hist.length - 1];
  if (!p.climb && Math.hypot(p.x - last.x, p.y - last.y) > 0.6) { L.hist.push({ x: p.x, y: p.y }); if (L.hist.length > 400) L.hist.shift(); L.moved += Math.abs(p.x - last.x); }
  for (let i = 0; i < 4; i++) {
    const q = L.pups[i];
    if (q.ov) { q.x = q.ox; q.y = q.oy; q.face = q.oface; continue; }
    const tg = chainTarget(chainSlot(i));
    const dx = tg.x - q.x;
    q.moving = Math.abs(dx) > 0.5 || Math.abs(tg.y - q.y) > 0.5;
    if (Math.abs(dx) > 0.3) q.face = dx > 0 ? 1 : -1;
    q.x = lerp(q.x, tg.x, Math.min(1, 0.35 * k)); q.y = lerp(q.y, tg.y, Math.min(1, 0.35 * k));
    if (q.moving) { q.idle = 0; q.phase += 0.3 * k; } else q.idle += dt;
  }

  // scripts
  L.scripts = L.scripts.filter(g => !g.next(dt).done);

  if (!busy && talentPress) useTalent();

  // search: key or tap on the world
  if (!busy && searchPress) {
    const h = L.hidden.find(h => h.revealed && !h.found && Math.abs(h.x - p.x) < 120 && Math.abs(h.y - (p.y - 50)) < 170);
    const sp = L.searches.find(s => !s.searched && Math.abs(s.x - p.x) < 120 && Math.abs(s.y - p.y) < 60);
    if (h) grabHidden(h); else if (sp) doSearch(sp);
    else say('Nothing to search right here. Look for twinkles! ✨', null, 2);
  }
  let tp;
  while ((tp = freeTap())) {
    const wx = tp.x + L.camX, wy = tp.y;
    const h = L.hidden.find(h => !h.found && Math.hypot(h.x - wx, h.y - wy) < 50);
    const sp = L.searches.find(s => !s.searched && Math.abs(s.x - wx) < 62 && wy < s.y + 10 && wy > s.y - 110);
    if (h && h.revealed) { if (Math.abs(h.x - p.x) < 320) grabHidden(h); else say('Walk closer to grab that sparkle!', null, 2); }
    else if (h && !h.revealed) { say('Hmm, did something twinkle? Someone with a keen eye could check!', 3, 2.5); }
    else if (sp) { if (Math.abs(sp.x - p.x) < 320) doSearch(sp); else say('Walk closer to search there!', null, 2); }
    else if (L.gate && L.gate.state === 'locked' && Math.abs(wx - (L.gate.x + 40)) < 70 && Math.abs(L.gate.x - p.x) < 200) tryGate(true);
  }
  L.searches.forEach(s => { if (s.wig > 0) s.wig = Math.max(0, s.wig - dt); });

  // pick up floating gems
  for (const g of L.gems) if (!g.got && Math.abs(g.x - p.x) < 30 && g.y > p.y - p.h - 10 && g.y < p.y + 10) { g.got = true; addGems(1, g.x, g.y); }

  // diamond door
  if (L.gate) {
    const g = L.gate;
    if (g.state === 'locked') {
      const touching = p.x + p.w / 2 >= g.x - 3 && p.x < g.x && Math.abs(p.y - g.base) < 4;
      if (L.gateCool && p.x < g.x - 90) L.gateCool = false;
      if (touching && !L.gateCool && !busy) tryGate(false);
    }
    const ped = L.pedestal;
    if (!ped.taken && g.state === 'open' && Math.abs(p.x - ped.x) < 50) collectDiamond();
  }

  updateHints(dt);

  // camera
  const target = clamp(p.x - 380, 0, L.len - W);
  L.camX = lerp(L.camX, target, Math.min(1, 0.12 * k));
}
function tryGate(tapped) {
  if (!L.hasKey) { if (tapped || !L.msg) { Snd.play('wrong'); say(TEACH.gate.text, null, 3.6); } L.gateCool = true; return; }
  L.overlay = 'puzzle';
  L.puzzle = makePuzzle(L.def.puzzle, () => { L.overlay = null; L.puzzle = null; run(scOpenGate()); },
    () => { L.overlay = null; L.puzzle = null; L.gateCool = true; say('Come back to the door when you are ready!', null, 2.5); });
}
function collectDiamond() {
  const ped = L.pedestal; ped.taken = true;
  Snd.play('fanfare');
  save.diamonds[L.def.id] = true;
  save.gems[L.def.id] = Math.max(save.gems[L.def.id] || 0, L.gemCount);
  writeSave();
  L.overlay = 'win'; L.winT = 0; L.msg = null; L.hint = null;
  for (let i = 0; i < 4; i++) setTimeout(() => burst(rnd(150, 810), rnd(80, 200), 30, ['#ffd23a', '#ff7eb6', '#7fe0ff', '#9bff7a', '#c49bff'], { type: 'confetti', screen: true, up: 2 }), i * 350);
}
function selectPup(i) {
  if (L.active === i) return;
  L.active = i; Snd.play('switch');
  const P = PUPS[i];
  say(P.name + ' the ' + P.talent + '! (' + P.verb + ')', i, 2);
}
function updateHints(dt) {
  const p = L.player; let best = null;
  if (!save.seen.move && L.moved >= 250) markSeen('move');
  const consider = (key, x, y, range) => {
    const d = Math.abs(x - p.x);
    if (d < range && Math.abs(y - p.y) < 90 && (!best || d < best.d)) best = { key, d };
  };
  if (!save.seen.move && L.moved < 250) best = { key: 'move', d: 0 };
  else {
    L.boulders.forEach(b => b.state === 'idle' && consider('boulder', b.x - b.r, b.top, 320));
    L.walls.forEach(w => w.state === 'idle' && consider('gap', w.x, w.base, 320));
    L.ledges.forEach(l => l.state === 'idle' && consider('ledge', l.x, l.base, 320));
    L.sniffs.forEach(s => s.state === 'idle' && consider('sniff', s.x, s.y, 240));
    L.digs.forEach(d => d.state === 'x' && consider('dig', d.x, d.y, 260));
    if (!save.seen.search) L.searches.forEach(s => !s.searched && consider('search', s.x, s.y, 220));
    L.hiddenZones.forEach(z => { if (p.x > z.x && p.x < z.x2 && L.hidden.some(h => !h.revealed && h.x > z.x && h.x < z.x2)) consider('hidden', p.x, p.y, 10); });
    if (L.gate && L.gate.state === 'locked') consider(L.hasKey ? 'gateKey' : 'gate', L.gate.x, L.gate.base, 300);
  }
  if (!best) { L.hint = null; return; }
  const key = best.key;
  L.nearT[key] = (L.nearT[key] || 0) + dt;
  const teach = !save.seen[key] || (L.wrong[key] || 0) >= 2 || L.nearT[key] > 14 || key === 'gate' || key === 'gateKey' || key === 'search';
  L.hint = teach ? { text: TEACH[key].text, who: TEACH[key].who } : { text: REMIND[key], who: null };
}

// ---------- drawing ----------
function levelDraw(t) {
  const T = L.T, cam = Math.round(L.camX);
  drawBackground(L.def.theme, cam, L.t);
  ctx.save();
  const sx = L.shake ? rnd(-L.shake, L.shake) * 0.5 : 0, sy = L.shake ? rnd(-L.shake, L.shake) * 0.5 : 0;
  ctx.translate(-cam + sx, sy);
  const vis = (x, w) => x + (w || 0) > cam - 200 && x < cam + W + 200;
  // ground
  for (const b of L.blocks) if (!b.fill && vis(b.x, b.w)) drawBlock(T, b, 0, L.def.theme);
  // ladders
  for (const l of L.ledges) if (l.ladder > 0 && vis(l.x - 40, 60)) drawLadder(l);
  // signs
  for (const s of L.signs) if (vis(s.x - 70, 140)) drawSign(s.x, s.y, s.text, L.t);
  // sniff spots & trails
  for (const s of L.sniffs) if (vis(Math.min(s.x, s.target.x) - 60, Math.abs(s.target.x - s.x) + 120)) drawSniff(s);
  for (const d of L.digs) if (vis(d.x - 60, 120)) drawDig(d);
  // platforms
  for (const pl of L.plats) if (vis(pl.x, pl.w)) drawPlatform(pl);
  // search props
  for (const s of L.searches) if (vis(s.x - 70, 140)) drawSearchProp(s.kind, s.x, s.y, s.wig, s.searched, L.t);
  // hidden sparkles
  for (const h of L.hidden) if (!h.found && vis(h.x - 40, 80)) drawHidden(h);
  // gems
  for (const g of L.gems) if (!g.got && vis(g.x - 20, 40)) drawGem(g.x, g.y, 11, g.c, L.t);
  // pedestal + diamond
  if (L.pedestal && vis(L.pedestal.x - 80, 160)) drawPedestal(L.pedestal.x, L.pedestal.base, L.def.diamond.color, L.t, L.pedestal.taken);
  // boulders (before pups so Boots stands in front)
  for (const b of L.boulders) if (vis(b.x - b.r, b.r * 2)) drawBoulder(T, b.x, b.y, b.r, b.rot, L.def.theme);
  // puppies (back of the line first) and the girl
  const order = [0, 1, 2, 3].sort((a, b) => chainSlot(b) - chainSlot(a));
  for (const i of order) {
    const q = L.pups[i];
    const sit = q.ov ? q.osit : (!q.moving && q.idle > 0.5);
    const bob = q.moving || q.ov ? -Math.abs(Math.sin(q.phase)) * 5 : 0;
    drawPup(i, q.x, q.y, { face: q.face, sit, bob, rot: q.ov ? q.orot : 0, glow: i === L.active });
  }
  const p = L.player;
  drawGirl(p.x, p.y, { face: p.face, phase: p.phase, moving: Math.abs(p.vx) > 0.3, air: !p.onGround && !p.climb, climb: p.climb });
  // walls & gate in front
  for (const w of L.walls) if (vis(w.x - 40, 400)) drawWall(T, w, 0, L.t);
  if (L.gate && vis(L.gate.x - 60, 200)) drawGate(L.gate, 0, L.t, L.def.diamond.color);
  // patch's keen-eye ring
  if (L.ring) { ctx.strokeStyle = 'rgba(255,215,60,' + (1 - L.ring.t / 1.2) + ')'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(L.ring.x, L.ring.y, 20 + L.ring.t * 600, 0, 7); ctx.stroke(); }
  drawParticles(0, false);
  for (const f of L.floats) txt(f.text, f.x, f.y, 30, '#ffe14d', 'center');
  if (L.keyFly) { const k = L.keyFly; drawKey(k.x, k.y - Math.min(1, k.t * 2) * 70, 1.6, Math.sin(k.t * 6) * 0.3); }
  ctx.restore();
  drawHUD(t);
  if (L.introT > 0) drawIntro();
  if (L.overlay === 'puzzle' && L.puzzle) L.puzzle.draw(t);
  if (L.overlay === 'pause') drawPause();
  if (L.overlay === 'win') drawWin(t);
  drawParticles(0, true);
}
function drawLadder(l) {
  const len = (l.base - l.top) * l.ladder, x = l.x - 17;
  ctx.strokeStyle = '#7a4a26'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x - 14, l.top - 6); ctx.lineTo(x - 14, l.top + len); ctx.moveTo(x + 14, l.top - 6); ctx.lineTo(x + 14, l.top + len); ctx.stroke();
  ctx.strokeStyle = '#c99a5a'; ctx.lineWidth = 6;
  for (let y = l.top + 16; y < l.top + len; y += 24) { ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x + 14, y); ctx.stroke(); }
  ctx.fillStyle = '#7a4a26'; ctx.beginPath(); ctx.arc(x - 14, l.top - 6, 5, 0, 7); ctx.arc(x + 14, l.top - 6, 5, 0, 7); ctx.fill();
}

  const T = L.T;
  rr(pl.x, pl.y, pl.w, 22, 10); ctx.fillStyle = T.body; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = darken(T.body, 0.45); ctx.stroke();

}
function drawSniff(s) {

    ctx.fillStyle = '#c4a060'; ctx.beginPath(); ctx.ellipse(s.x - 12, s.y - 8, 12, 5, 0.3, 0, 7); ctx.ellipse(s.x + 14, s.y - 7, 10, 4, -0.3, 0, 7); ctx.fill();

function drawCtrl(r, icon, color, label, active, alpha) {

  rr(r.x, r.y, r.w, r.h, 22); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,40,0.8)'; ctx.stroke();

function arrowIcon(dir) {

function drawHUD(t) {

    const r = pupRect(i), act = i === L.active;
    rr(r.x, r.y, r.w, r.h, 16); ctx.fillStyle = act ? 'rgba(255,240,170,0.95)' : 'rgba(255,255,255,0.7)'; ctx.fill();

}
function drawIntro() {
  const a = Math.min(1, L.introT / 0.5);

  panel(W / 2 - 300, 150, 600, 170, '#fff8ec', '#6b3b2a');

  txt(L.def.name, W / 2 + 40, 195, 44, '#ff7a3a', 'center');
  txt(L.def.continent, W / 2 + 40, 242, 26, '#6b3b2a', 'center', { stroke: false });

  }

<script>
'use strict';
// ===== Diamond Pups: title, customize, world map, trophy case =====
let scene = null, sceneName = '', sceneT = 0, fade = 0;
const SCENES = {};
function go(name, arg) {

  particles = [];

}
function muteBtn(r) { if (button(r, '', { icon: Snd.muted ? '🔇' : '🔊', color: '#7f9bd8', key: null })) Snd.setMuted(!Snd.muted); }
function sunnyBg(t) {

<script>
'use strict';
// ===== Diamond Pups: main loop + test hooks =====
let lastT = 0, clock = 0, started = false;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - lastT) / 1000 || 0.016));
  lastT = ts; clock += dt; sceneT += dt;
  try {
    if (pressed.KeyM) Snd.setMuted(!Snd.muted);
    Music.update();
    scene.update(dt);
    ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    scene.draw(clock);
    if (fade > 0) { ctx.fillStyle = 'rgba(255,255,255,' + fade + ')'; ctx.fillRect(0, 0, W, H); fade = Math.max(0, fade - dt * 3); }
  } finally {
    endFrameInput();
  }
  requestAnimationFrame(frame);
}
function boot() {
  if (started) return; started = true;
  const ld = document.getElementById('loading'); if (ld) ld.style.display = 'none';
  go('title');
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
function waitAssets() {
  const fontP = (document.fonts && document.fonts.load) ? document.fonts.load("600 30px Fredoka").catch(() => {}) : Promise.resolve();
  const imgsP = new Promise(res => { const chk = () => imgPending <= 0 ? res() : setTimeout(chk, 30); chk(); });
  Promise.race([Promise.all([fontP, imgsP]), new Promise(res => setTimeout(res, 2500))]).then(boot);
}
waitAssets();

// ----- hidden test hook (used by the automated Playwright tests) -----
window.DP = {
  scene: () => sceneName,
  go: (n, a) => go(n, a),
  save: () => JSON.parse(JSON.stringify(save)),
  level: () => L,
  teleport(x) { if (!L) return; const p = L.player; p.x = x; p.vx = 0; p.vy = 0;
    const b = L.blocks.filter(b => x >= b.x && x <= b.x + b.w).sort((a, c) => a.top - c.top)[0]; p.y = b ? b.top : GY;
    L.hist = []; for (let k = 0; k < 80; k++) L.hist.push({ x: x - (80 - k) * 4, y: p.y }); L.pups.forEach(q => { q.x = x - 40; q.y = p.y; q.ov = false; }); L.camX = clamp(x - 380, 0, L.len - W); if (b) L.safe = { x, y: p.y }; },
  pup(i) { if (L) selectPup(i); },
  talent() { if (L) useTalent(); },
  busy: () => !!(L && L.scripts.length),
  objects() { if (!L) return null; return { boulders: L.boulders.map(b => [b.x, b.state]), walls: L.walls.map(w => [w.x, w.state]), ledges: L.ledges.map(l => [l.x, l.state, l.top]),
    sniffs: L.sniffs.map(s => [s.x, s.state, s.target.x]), digs: L.digs.map(d => [d.x, d.state]), hidden: L.hidden.map(h => [h.x, h.y, h.revealed, h.found]),
    searches: L.searches.map(s => [s.x, s.searched]), gate: L.gate && [L.gate.x, L.gate.state], pedestal: L.pedestal && [L.pedestal.x, L.pedestal.taken], len: L.len }; },
  solvePuzzle() { if (L && L.puzzle) L.puzzle.solve(); },
  giveKey() { if (L) L.hasKey = true; },
};
Object.defineProperty(window, 'gameState', { get() {
  return { scene: sceneName, level: L && sceneName === 'level' ? L.def.id : null, x: L ? Math.round(L.player.x) : null, y: L ? Math.round(L.player.y) : null,
    pup: L ? PUPS[L.active].name : null, hasKey: L ? L.hasKey : null, gems: L ? L.gemCount : null, overlay: L ? L.overlay : null,
    diamonds: Object.keys(save.diamonds), muted: Snd.muted };
} });

</script>
